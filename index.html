<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Habit Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- 1. Header Section -->
    <header>
      <h1>✨ Daily Habit Tracker</h1>
      <p id="today-date"></p>
    </header>

    <!-- 2. Add Habit Section -->
    <div class="input-section">
      <input type="text" id="habit-input" placeholder="Enter a new habit (e.g., Read 15 mins)..." />
      <select id="habit-category">
        <option value="💧 Health">💧 Health</option>
        <option value="📚 Study">📚 Study</option>
        <option value="🏃 Fitness">🏃 Fitness</option>
        <option value="🧘 Mindfulness">🧘 Mindfulness</option>
        <option value="💻 Coding">💻 Coding</option>
        <option value="🎨 Creativity">🎨 Creativity</option>
      </select>
      <button id="add-btn">Add Habit</button>
    </div>

    <!-- 3. Progress / Stats Section -->
    <div class="stats-card">
      <div class="stats-info">
        <span>Today's Progress</span>
        <span id="progress-text">0 / 0 completed</span>
      </div>
      <div class="progress-bar-bg">
        <div id="progress-bar-fill"></div>
      </div>
    </div>

    <!-- 4. Habits List Container (where our habits will appear) -->
    <div id="habit-list" class="habit-list">
      <!-- Habits will be dynamically added here by our JavaScript -->
    </div>
  </div>

  <!-- Link our JavaScript file at the very bottom -->
  <script src="script.js"></script>
 
</body>
</html>
