<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Habit Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- 1. Header Section -->
    <header>
      <h1>✨ Daily Habit Tracker</h1>
      <p id="today-date"></p>
    </header>

    <!-- 2. Add Habit Section (With Headings Above Each Box) -->
    <div class="input-section">
      <!-- Habit Name -->
      <div class="form-group habit-name-group">
        <label for="habit-input">Enter a new habit</label>
        <input type="text" id="habit-input" placeholder="eg: ( Read 15 mins )" />
      </div>

      <!-- Category -->
      <div class="form-group category-group">
        <label for="habit-category">Category</label>
        <select id="habit-category">
          <option value="💧 Health">💧 Health</option>
          <option value="📚 Study">📚 Study</option>
          <option value="💻 Coding">💻 Coding</option>
          <option value="🏃 Fitness">🏃 Fitness</option>
          <option value="🧘 Mindfulness">🧘 Mindfulness</option>
          <option value="🎨 Creativity">🎨 Creativity</option>
          <option value="__NEW__">➕ Add Category</option>
        </select>
        <input type="text" id="custom-category-input" placeholder="Enter new category..." style="display: none;" />
      </div>

      <!-- No. of days -->
      <div class="form-group days-group">
        <label for="habit-days">No. of days</label>
        <input type="number" id="habit-days" placeholder="Days" min="1" value="21" />
      </div>

      <!-- Start Date -->
      <div class="form-group date-group">
        <label for="start-date-option">Start date</label>
        <select id="start-date-option">
          <option value="today">Start today</option>
          <option value="custom">Custom date</option>
        </select>
        <input type="date" id="custom-date-input" style="display: none;" />
      </div>

      <!-- Add Habit Button -->
      <div class="form-group btn-group">
        <button id="add-btn">Add Habit</button>
      </div>
    </div>

    <!-- 3. Progress / Stats Section -->
    <div class="stats-card">
      <div class="stats-info">
        <span>Today's Progress</span>
        <span id="progress-text">0 / 0 completed</span>
      </div>
      <div class="progress-bar-bg">
        <div id="progress-bar-fill"></div>
      </div>
    </div>

    <!-- 4. Habits List Container (where our habits will appear) -->
    <div id="habit-list" class="habit-list">
      <!-- Habits will be dynamically added here by our JavaScript -->
    </div>
  </div>

  <!-- Link our JavaScript file at the very bottom -->
  <script src="script.js"></script>
 
</body>
</html>
